<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voiceover Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-cyan-400">🎙️ AI Voiceover Studio</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1 text-slate-300">Your Text (English Only):</label>
            <textarea id="textInput" rows="4" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-400 text-white" placeholder="Type or paste your English text here..."></textarea>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-1 text-slate-300">Voice Tone / Style:</label>
            <input id="toneInput" type="text" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-400 text-white" placeholder="e.g., Deep, Cinematic, Happy, Energetic, Soft...">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-1 text-slate-300">Select Character:</label>
            <select id="charSelect" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-cyan-400 text-white">
                <option value="Puck">Puck (Male - Fast & Friendly)</option>
                <option value="Charon">Charon (Male - Deep & Calm)</option>
                <option value="Kore">Kore (Female - Clear & Professional)</option>
                <option value="Fenrir">Fenrir (Male - Dramatic)</option>
            </select>
        </div>

        <button id="genBtn" onclick="generateVoice()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold py-3 rounded-lg transition-all shadow-lg cursor-pointer">
            Generate Voice 🚀
        </button>

        <div id="audioContainer" class="mt-6 hidden border-t border-slate-700 pt-4 text-center">
            <p class="text-sm text-green-400 mb-2">✓ Voice Generated Successfully!</p>
            <audio id="audioPlayer" controls class="w-full mt-2"></audio>
        </div>
    </div>

    <script>
        async function generateVoice() {
            const text = document.getElementById('textInput').value;
            const tone = document.getElementById('toneInput').value || "Professional";
            const voice = document.getElementById('charSelect').value;
            const btn = document.getElementById('genBtn');
            const audioContainer = document.getElementById('audioContainer');
            const audioPlayer = document.getElementById('audioPlayer');

            if (!text) {
                alert("Please write some text first!");
                return;
            }

            // আপলোড করা API Key সরাসরি এখানে সেট করে দেওয়া হলো
            const apiKey = "AIzaSyAyNyDzWXweJgCD1gxqfe7h-GxrWIK8Grs"; 

            btn.disabled = true;
            btn.innerText = "Generating Voice... Please wait... ⏳";
            audioContainer.classList.add('hidden');

            // Gemini v1beta Endpoint for Audio
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

            const systemPrompt = `You are an expert Text-to-Speech system. Read the user text perfectly. Tone style requested: ${tone}. Respond ONLY with the requested audio generation data. Do not write any chat text.`;

            const payload = {
                contents: [{ parts: [{ text: `${systemPrompt}\n\nText to read: ${text}` }] }],
                generationConfig: {
                    responseMimeType: "audio/mp3",
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: voice }
                        }
                    }
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].inlineData) {
                    const base64Audio = data.candidates[0].content.parts[0].inlineData.data;
                    audioPlayer.src = `data:audio/mp3;base64,${base64Audio}`;
                    audioContainer.classList.remove('hidden');
                    audioPlayer.play(); // অটোমেটিক প্লে হবে
                } else {
                    throw new Error("Invalid structure");
                }
            } catch (error) {
                console.error(error);
                alert("ভয়েস তৈরি করা যায়নি! গুগল সার্ভার ব্রাউজার রিকোয়েস্ট ব্লক করছে অথবা কি-টি সঠিক নয়।");
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Voice 🚀";
            }
        }
    </script>
</body>
</html>
